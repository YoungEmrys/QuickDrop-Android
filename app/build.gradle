plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.quickdrop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quickdrop.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'

        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        stableDebug {
            storeFile file('quickdrop-update.keystore')
            storePassword 'qdUpdateKey2026'
            keyAlias 'quickdrop-update'
            keyPassword 'qdUpdateKey2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
