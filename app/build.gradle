plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.quickdrop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quickdrop.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk { abiFilters 'arm64-v8a' }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
